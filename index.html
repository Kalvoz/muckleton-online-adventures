<template data-route="/world"><main><header class="site-header"><a href="#/" class="brand" aria-label="Muckleton home"><img class="brand-emblem" src="muckleton-emblem.png" alt=""/><span><b>MUCKLETON</b><small>ONLINE ADVENTURES</small></span></a><nav id="primary-navigation" aria-label="Primary navigation"><a href="#/wiki">Wiki</a><a href="#/world">World</a><a href="#/patches">Updates</a><a href="#/community">Community</a><a href="https://discord.gg/r2qwwZqTkF" target="_blank" rel="noreferrer">Discord</a><a class="mobile-account-link" href="#/account">My account</a></nav><div class="header-actions"><a class="login-link" href="#/account" aria-label="My account"><span class="status-dot"></span><span class="account-label">My account</span></a><button class="mobile-menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open navigation"><span aria-hidden="true">☰</span></button></div></header><section class="page-hero"><p class="eyebrow">THE LIVING WORLD</p><h1>The road to Elderhavn</h1><p>Seven outdoor regions form the current journey to level 30. Each area has its own ecology, routes and encounter rhythm.</p></section><div class="page-content"><section class="atlas"><div class="atlas-map" aria-label="Stylised route through seven Muckleton regions"><a href="#ribbit-clearing" class="atlas-node node-1"><span>1</span><b>Ribbit Clearing</b><small>Lv. <!-- -->1–8</small></a><a href="#mirewood-crossing" class="atlas-node node-2"><span>2</span><b>Mirewood Crossing</b><small>Lv. <!-- -->7–15</small></a><a href="#mirefen-basin" class="atlas-node node-3"><span>3</span><b>Mirefen Basin</b><small>Lv. <!-- -->14–22</small></a><a href="#gloamcap-wilds" class="atlas-node node-4"><span>4</span><b>Gloamcap Wilds</b><small>Lv. <!-- -->18–24</small></a><a href="#ashenroot-frontier" class="atlas-node node-5"><span>5</span><b>Ashenroot Frontier</b><small>Lv. <!-- -->24–29</small></a><a href="#threshold-march" class="atlas-node node-6"><span>6</span><b>Threshold March</b><small>Lv. <!-- -->29–30</small></a><a href="#elderhavn" class="atlas-node node-7"><span>7</span><b>Elderhavn</b><small>Lv. <!-- -->30</small></a><div class="atlas-route"></div></div><aside><p class="eyebrow">CURRENT JOURNEY</p><h2>From the wetlands to the city</h2><p>The atlas is an authored guide rather than a technical rendering of the game&#x27;s hidden scene coordinates.</p><ul><li><span>7</span> outdoor regions</li><li><span>7</span> caves &amp; dungeons</li><li><span>1</span> level-30 raid approach</li></ul></aside></section><section class="zone-list"><article id="ribbit-clearing"><span class="zone-number">01</span><div><p class="eyebrow">Starter region<!-- --> · LEVELS <!-- -->1–8</p><h2>Ribbit Clearing</h2><p>A green lowland clearing with ponds, frog camps and roads leading to a cave and drowned temple.</p></div><b>Continue north-west →</b></article><article id="mirewood-crossing"><span class="zone-number">02</span><div><p class="eyebrow">Forest &amp; mire<!-- --> · LEVELS <!-- -->7–15</p><h2>Mirewood Crossing</h2><p>Dark forest pockets, nine grind camps and the road onward to Mirefen Basin.</p></div><b>Continue north-west →</b></article><article id="mirefen-basin"><span class="zone-number">03</span><div><p class="eyebrow">Wetland basin<!-- --> · LEVELS <!-- -->14–22</p><h2>Mirefen Basin</h2><p>A large, aggressive ecosystem with the Fenwarden hub, open water and three regional instances.</p></div><b>Continue north-west →</b></article><article id="gloamcap-wilds"><span class="zone-number">04</span><div><p class="eyebrow">Fungal wilds<!-- --> · LEVELS <!-- -->18–24</p><h2>Gloamcap Wilds</h2><p>A broad grind route with violet mushroom forests, two instance landmarks and ten monster camps.</p></div><b>Continue north-west →</b></article><article id="ashenroot-frontier"><span class="zone-number">05</span><div><p class="eyebrow">Scorched frontier<!-- --> · LEVELS <!-- -->24–29</p><h2>Ashenroot Frontier</h2><p>Burnt terrain with drakes, crushers and ember casters along the road to level 30.</p></div><b>Continue north-west →</b></article><article id="threshold-march"><span class="zone-number">06</span><div><p class="eyebrow">Raid approach<!-- --> · LEVELS <!-- -->29–30</p><h2>Threshold March</h2><p>Three short elite packs guard the approach to Muckleton&#x27;s first raid gate: The Crownless Gate.</p></div><b>Continue north-west →</b></article><article id="elderhavn"><span class="zone-number">07</span><div><p class="eyebrow">Social capital<!-- --> · LEVELS <!-- -->30</p><h2>Elderhavn</h2><p>A broad capital with a market, forge, training court, guild quarter and Wayfarer Shrine.</p></div><b>Journey&#x27;s current end</b></article></section><section class="instance-strip"><p class="eyebrow">EXPLORE BEYOND THE ROAD</p><h2>Caves, dungeons &amp; landmarks</h2><div><span><b>⌂</b>Mossback Hollow</span><span><b>♜</b>The Sunken Reliquary</span><span><b>✦</b>Rotroot Burrow</span><span><b>⌂</b>Briarfen Hold</span><span><b>♜</b>Gloamroot Cave</span><span><b>✦</b>The Drowned Temple</span><span><b>⌂</b>Rootvault Depths</span><span><b>♜</b>The Crownless Gate</span></div></section></div><footer><div class="brand compact"><img class="brand-emblem" src="muckleton-emblem.png" alt=""/><span><b>MUCKLETON</b><small>ONLINE ADVENTURES</small></span></div><p>A world in development. Built with care, one path at a time.</p><nav><a href="#/patches">Status</a><a href="#/community">Feedback</a><a href="#/wiki">Wiki</a><a href="https://discord.gg/r2qwwZqTkF" target="_blank" rel="noreferrer">Discord</a><a href="https://www.youtube.com/@Muckleton" target="_blank" rel="noreferrer">YouTube</a></nav></footer></main></template>
<template data-route="/patches"><main><header class="site-header"><a href="#/" class="brand" aria-label="Muckleton home"><img class="brand-emblem" src="muckleton-emblem.png" alt=""/><span><b>MUCKLETON</b><small>ONLINE ADVENTURES</small></span></a><nav id="primary-navigation" aria-label="Primary navigation"><a href="#/wiki">Wiki</a><a href="#/world">World</a><a href="#/patches">Updates</a><a href="#/community">Community</a><a href="https://discord.gg/r2qwwZqTkF" target="_blank" rel="noreferrer">Discord</a><a class="mobile-account-link" href="#/account">My account</a></nav><div class="header-actions"><a class="login-link" href="#/account" aria-label="My account"><span class="status-dot"></span><span class="account-label">My account</span></a><button class="mobile-menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open navigation"><span aria-hidden="true">☰</span></button></div></header><section class="page-hero"><p class="eyebrow">DEVELOPMENT LOG</p><h1>Patch notes</h1><p>Follow the world as it grows. Official updates document new regions, combat changes and the systems shaping Muckleton.</p></section><div class="page-content"><div class="patch-layout"><aside class="patch-index"><p class="eyebrow">VERSIONS</p><a href="#patch-0.4.2"><b>0.4.2</b><span>The Road to Elderhavn</span></a><a href="#patch-0.4.1"><b>0.4.1</b><span>A Language for Caves</span></a><a href="#patch-0.4.0"><b>0.4.0</b><span>Mirefen Awakens</span></a></aside><section class="patch-feed"><article id="patch-0.4.2" class="latest"><div class="patch-topline"><span>World</span><time>August 28, 2026</time></div><p class="eyebrow">PATCH <!-- -->0.4.2</p><h2>The Road to Elderhavn</h2><p>Gloamcap Wilds, Ashenroot Frontier, Threshold March and Elderhavn now form a connected journey to level 30.</p><h3>Highlights</h3><ul><li>Seven outdoor regions are now connected in the new world atlas.</li><li>Mount-readable zone sizes and more deliberate monster distribution.</li><li>Active zones now correctly isolate visuals, AI and collision from hidden regions.</li></ul><b class="latest-badge">LATEST</b></article><article id="patch-0.4.1" class=""><div class="patch-topline"><span>Art &amp; world</span><time>August 22, 2026</time></div><p class="eyebrow">PATCH <!-- -->0.4.1</p><h2>A Language for Caves</h2><p>Cave and dungeon entrances now share biome-aware visual rules while preserving their local identities.</p><h3>Highlights</h3><ul><li>Natural cave mouths use boulders, timber supports and local growth.</li><li>Dungeons use constructed thresholds, arch stones and biome-coloured braziers.</li><li>Interior exits now match the visual language of their entrance.</li></ul></article><article id="patch-0.4.0" class=""><div class="patch-topline"><span>Content</span><time>August 14, 2026</time></div><p class="eyebrow">PATCH <!-- -->0.4.0</p><h2>Mirefen Awakens</h2><p>Mirefen Basin and five regional instances introduce new families, bosses and distinct loot identities.</p><h3>Highlights</h3><ul><li>Fen Drakes, Marsh Wisps, Reed Stalkers and Drowned Acolytes have arrived.</li><li>Rotroot, Briarfen, Gloamroot, Drowned Temple and Rootvault can now be explored.</li><li>Ranged monsters now use server-authoritative projectiles.</li></ul></article></section></div></div><footer><div class="brand compact"><img class="brand-emblem" src="muckleton-emblem.png" alt=""/><span><b>MUCKLETON</b><small>ONLINE ADVENTURES</small></span></div><p>A world in development. Built with care, one path at a time.</p><nav><a href="#/patches">Status</a><a href="#/community">Feedback</a><a href="#/wiki">Wiki</a><a href="https://discord.gg/r2qwwZqTkF" target="_blank" rel="noreferrer">Discord</a><a href="https://www.youtube.com/@Muckleton" target="_blank" rel="noreferrer">YouTube</a></nav></footer></main></template>

<script>
(() => {
  const outlet = document.querySelector('[data-page-outlet]');
  const templates = new Map([...document.querySelectorAll('template[data-route]')].map(t => [t.dataset.route, t]));
  const render = () => {
    const route = decodeURIComponent(location.hash.slice(1) || '/').replace(/\/$/, '') || '/';
    const template = templates.get(route) || templates.get('/');
    outlet.replaceChildren(template.content.cloneNode(true));
    document.title = (outlet.querySelector('h1')?.textContent?.trim() || 'Muckleton') + ' | Muckleton Online Adventures';
    outlet.querySelector('.mobile-menu-toggle')?.addEventListener('click', function () {
      const header = outlet.querySelector('.site-header');
      const open = header.classList.toggle('menu-open');
      this.setAttribute('aria-expanded', String(open));
      this.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
      this.firstElementChild.textContent = open ? '×' : '☰';
    });
    outlet.querySelectorAll('form').forEach(form => form.addEventListener('submit', event => {
      event.preventDefault();
      alert('This is the public preview. Live account and forum services will be connected separately.');
    }));
    outlet.querySelectorAll('button').forEach(button => {
      if (button.classList.contains('mobile-menu-toggle')) return;
      button.addEventListener('click', () => {
        if (button.closest('form')) return;
        alert('This interactive feature is available in the full hosted version.');
      });
    });
    outlet.querySelectorAll('a[data-auth-provider]').forEach(link => link.addEventListener('click', event => {
      event.preventDefault();
      alert('Google and Steam sign-in are available on the fully hosted Muckleton account portal.');
    }));
    scrollTo({ top: 0, behavior: 'instant' });
  };
  addEventListener('hashchange', render);
  render();
})();
</script>
